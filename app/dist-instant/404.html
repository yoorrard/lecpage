<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾지 못했어요 · lecpage</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FFFAF7;color:#473C3B;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;padding:20px}
main{text-align:center;display:grid;gap:14px;justify-items:center}
a{display:inline-block;padding:12px 20px;border-radius:12px;background:#473C3B;color:#FFFAF7;text-decoration:none;font-weight:700}
a:focus-visible{outline:3px solid #5B49B0;outline-offset:3px}
@media (prefers-color-scheme:dark){body{background:#1E1A19;color:#F3ECE7}a{background:#C0B4E1;color:#1D1733}}
</style>
</head>
<body>
<main>
<img src="/favicon.svg" width="72" height="72" alt="" data-home-src>
<h1>페이지를 찾지 못했어요</h1>
<p>주소가 틀렸거나 없어진 페이지예요. 처음 화면의 '내 연수'에서 이어서 만들 수 있어요.</p>
<a href="/" data-home>lecpage 처음으로</a>
</main>
<script>
// 깊은 주소(/a/b/c)에서도 처음 화면으로: 늘 사이트 맨 위로. 예비 주소(GitHub Pages)는 /lecpage/ 아래에 있음
(function () {
  var base = /\.github\.io$/.test(location.hostname) ? '/lecpage/' : '/';
  var a = document.querySelector('[data-home]'); if (a) a.setAttribute('href', base);
  var i = document.querySelector('[data-home-src]'); if (i) i.setAttribute('src', base + 'favicon.svg');
})();
</script>
</body>
</html>
