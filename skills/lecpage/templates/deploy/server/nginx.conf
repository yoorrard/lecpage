# lecpage 생성 사이트 + node-server(실시간) — nginx 설정
# 놓는 곳: /etc/nginx/conf.d/lecpage.conf (Debian/Ubuntu는 /etc/nginx/sites-available/ 후 링크)
# 확인: sudo nginx -t && sudo systemctl reload nginx
#
# 치환
#   {{DOMAIN}}      예) lec.school.kr
#   {{SITE_ROOT}}   예) /var/www/lecpage/site   (index.html 이 있는 폴더)
#   {{LIVE_UPSTREAM}} node-server 주소. 같은 기계면 127.0.0.1:8787
#                   (node-server는 LEC_TRUST_PROXY=1 로 실행해야 참가자 IP별 속도 제한이 맞게 동작)
# 인증서: certbot (sudo certbot --nginx -d {{DOMAIN}}) 이 아래 ssl_certificate 줄을 관리합니다.
#
# 원칙
#  - 사이트와 /api 를 같은 주소로 제공 → CORS 걱정 없음, 학교 방화벽에 도메인 하나만 열면 됨
#  - WebSocket(/api/<code>/ws) 업그레이드, SSE(/api/<code>/events) 버퍼링 끄기
#  - add_header 는 server 블록에만 둡니다. location 안에 add_header 를 쓰면 위의 헤더가 사라지는
#    nginx 규칙이 있어서, 캐시는 expires 로만 조절합니다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream lecpage_live {
    server {{LIVE_UPSTREAM}};
    keepalive 16;
}

# 요청 속도 제한(참가자 1명당 초당 20회, 순간 40회까지)
limit_req_zone $binary_remote_addr zone=lecpage_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    # Let's Encrypt 확인용
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx 1.25.1 미만(예: Ubuntu 22.04 기본 1.18)은 이 줄을 지우고 위를 "listen 443 ssl http2;" 로
    server_name {{DOMAIN}};

    ssl_certificate     /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root {{SITE_ROOT}};
    index index.html;
    charset utf-8;
    client_max_body_size 21m;   # 게시판 파일 올리기 한도(node-server LEC_MAX_UPLOAD_MB 기본 20과 맞춤)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 같은 주소의 node-server만 쓰는 기준입니다. 다른 백엔드(Supabase 등)를 쓰면 connect-src 에 그 주소를,
    # 인라인 스크립트가 있으면 script-src 에 'sha256-...' 를 더하세요(_headers 의 {{LIVE_ORIGIN}}·{{SCRIPT_HASHES}} 규칙).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://hangeul.pstatic.net; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com https://hangeul.pstatic.net; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' wss://{{DOMAIN}} https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    # 공개하지 않을 파일
    location ~ (\.md|/\.[^/]*)$ {
        return 404;
    }

    # 실시간 API (WebSocket·SSE·폴링 모두)
    location /api/ {
        limit_req zone=lecpage_api burst=40 nodelay;
        proxy_pass http://lecpage_live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # SSE가 바로바로 전달되도록
        proxy_cache off;
        proxy_read_timeout 1h;        # 연수 시간 동안 연결 유지
        proxy_send_timeout 1h;
    }

    location ^~ /assets/slides/ {
        expires 1h;
        try_files $uri =404;
    }
    location ^~ /assets/media/ {
        expires 1h;
        try_files $uri =404;
    }
    location ~* \.html$ {
        expires -1;                   # Cache-Control: no-cache
        try_files $uri =404;
    }
    location = /assets/site.json {
        expires -1;
        try_files $uri =404;
    }
    location / {
        expires 5m;
        try_files $uri $uri/ =404;
    }
}
