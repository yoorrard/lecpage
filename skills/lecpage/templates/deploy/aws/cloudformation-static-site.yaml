# lecpage 생성 사이트용 최소 정적 호스팅: 비공개 S3 버킷 + CloudFront(OAC) + 보안 헤더
#
# 만들기(서울 리전 예시):
#   aws cloudformation deploy --region ap-northeast-2 \
#     --stack-name lec-20261104 \
#     --template-file cloudformation-static-site.yaml \
#     --parameter-overrides SiteName=lec-20261104 LiveOrigin="https://abcd.supabase.co wss://abcd.supabase.co"
#   aws cloudformation describe-stacks --stack-name lec-20261104 --query 'Stacks[0].Outputs' --output table
# 올리기: BUCKET=<BucketName 출력값> DISTRIBUTION_ID=<DistributionId 출력값> ./deploy-s3.sh ./site
# 지우기: 버킷을 비운 뒤(aws s3 rm s3://<버킷> --recursive) aws cloudformation delete-stack --stack-name ...
#
# 내 도메인: ACM 인증서는 반드시 us-east-1(버지니아 북부)에서 발급한 ARN이어야 합니다(CloudFront 규칙).
# 비용: CloudFront 종량제 상시 무료 한도(월 1TB 전송) 안이면 대부분 0원. S3 저장은 GB당 몇십 원 수준.
#   https://aws.amazon.com/cloudfront/pricing/pay-as-you-go/

AWSTemplateFormatVersion: "2010-09-09"
Description: lecpage static site (private S3 + CloudFront OAC + security headers)

Parameters:
  SiteName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,40}$"
    Description: 소문자·숫자·하이픈. 버킷 이름 앞부분으로 씁니다.
  LiveOrigin:
    Type: String
    Default: ""
    Description: 실시간 백엔드 주소(공백 구분). 없으면 비워 둡니다. 예) https://abcd.supabase.co wss://abcd.supabase.co
  ScriptHashes:
    Type: String
    Default: ""
    Description: (선택) 인라인 스크립트 해시. 예) 'sha256-AbC...='
  DomainName:
    Type: String
    Default: ""
    Description: (선택) 내 도메인. 예) lec.example.kr
  AcmCertificateArn:
    Type: String
    Default: ""
    Description: (선택) us-east-1에서 발급한 ACM 인증서 ARN. DomainName을 쓸 때 필수.

Conditions:
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref AcmCertificateArn, ""]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${SiteName}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${SiteName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${SiteName}-headers"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net ${ScriptHashes}; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://hangeul.pstatic.net; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com https://hangeul.pstatic.net; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com ${LiveOrigin}; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: SAMEORIGIN
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 15552000
            IncludeSubdomains: false
            Preload: false
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "lecpage ${SiteName}"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_All
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS 관리형 정책 "CachingOptimized" (원본의 Cache-Control을 존중)
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  SiteUrl:
    Value: !If
      - HasDomain
      - !Sub "https://${DomainName}/"
      - !Sub "https://${Distribution.DomainName}/"
