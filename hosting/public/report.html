<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>신고 · lecpage 바로 공개</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/host.css">
<script src="/report.js" defer></script>
</head>
<body>
<main>
<h1>사이트 신고</h1>
<p>이곳에 올라온 사이트가 저작권·초상권·개인정보를 침해하거나, 누군가의 명예를 해치거나, 사람을 속이려는 것 같다면 알려 주세요. 가려진 사이트를 올린 분이 사정을 알릴 때도 여기에 적어 주세요.</p>
<p>운영자가 확인하고, 확인하는 동안에는 사이트를 가려 둘 수 있습니다. 권리자라면 본인이 누구인지와 어떤 부분이 문제인지 알 수 있게 적어 주세요.</p>

<form data-report novalidate>
<label>사이트 주소
<input name="site" type="text" inputmode="url" autocomplete="off" required maxlength="300" placeholder="https://…/s/…/">
</label>
<label>신고하는 까닭
<textarea name="reason" required maxlength="2000"></textarea>
</label>
<label>연락처 <small>선택. 처리 결과를 받으려면 메일 주소를 남겨 주세요.</small>
<input name="contact" type="text" autocomplete="email" maxlength="200">
</label>
<button type="submit">신고 보내기</button>
<p role="status" aria-live="polite" data-status></p>
</form>

<p class="small">적어 주신 내용은 신고를 처리하는 데만 쓰고 90일 뒤에 지웁니다. <a href="/">이곳은 어떤 곳인가요?</a></p>
<noscript><p>이 화면은 자바스크립트를 켜야 보낼 수 있습니다.</p></noscript>
</main>
</body>
</html>
