# lecpage 커넥트(lecpage Connect, 예전 이름 lecpage studio)를 GitHub 릴리스 하나(studio-latest)로 늘 최신으로. 운영 비용 0원(GitHub 저장소·릴리스만 씀).
# 올리는 것(묶기는 scripts/studio-launcher/package.sh, 내 컴퓨터에서도 같은 결과):
#   lecpage-connect.cmd(Windows, 두 번 눌러 실행) · lecpage-connect.sh / .command(macOS·Linux, 터미널 한 줄) ·
#   lecpage-connect.zip / .tar.gz(+ .sha256, 실행 파일이 받아 확인 후 씀) · lecpage-connect-mac.zip(선택, lecpage Connect.app) · VERSION(새 판 확인용)
#   예전 이름 lecpage-studio.*도 같은 내용으로 함께(예전 링크·이미 깔린 실행 파일·켜 둔 자동 시작이 그 이름을 받음)
# 실행 파일은 Node.js가 없으면 nodejs.org의 LTS를 사용자 폴더에 받고(SHA-256 확인), 이 묶음을 받아 `node lecpage.mjs studio`로 켬.
name: studio-release
on:
  push:
    branches: [main]
    paths: ['skills/lecpage/**', 'scripts/studio-launcher/**', '.github/workflows/studio-release.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 액션은 CI와 같은 커밋 SHA로 고정
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # 시험이 교재 PDF를 읽으므로 CI와 같은 PDF 도구(pdf.js·poppler)를 둠
      - name: PDF 읽기 도구 설치
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils > /dev/null
          npm install --no-save --no-audit --no-fund "pdfjs-dist@$(node -p "require('./app/package.json').dependencies['pdfjs-dist']")"
      - name: lecpage 커넥트 시험
        run: node --test skills/lecpage/engine/test/studio.test.mjs skills/lecpage/engine/test/studio-sub.test.mjs
      - name: 묶기
        run: sh scripts/studio-launcher/package.sh out
      - name: studio-latest 릴리스 갱신
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          NOTES="lecpage 커넥트: lecpage.com과 이 PC를 이어 ChatGPT·Claude 계정으로 만들어요. Windows: lecpage-connect.cmd를 받아 두 번 눌러 실행(경고 창이 뜨면 [추가 정보] → [실행]). macOS·Linux: 터미널에 curl -fsSL https://github.com/yoorrard/lecpage/releases/download/studio-latest/lecpage-connect.sh | bash. (선택) macOS 앱 lecpage-connect-mac.zip은 서명이 없어 처음에 막혀요: 시스템 설정 → 개인정보 보호 및 보안 → [그래도 열기]. 켜지면 lecpage.com이 열리고 이 PC와 저절로 연결돼요. 예전 이름(lecpage-studio.*)도 같은 파일이에요. 이 릴리스는 main에 바뀐 것이 있을 때마다 새로 올라가요."
          # 태그는 처음 한 번만 만들고(강제로 옮기지 않음) 파일만 바꿔 올림. 제목·안내는 매번 맞춤
          if ! gh release view studio-latest >/dev/null 2>&1; then
            gh release create studio-latest --target "$GITHUB_SHA" --title "lecpage 커넥트(최신)" --latest=false --notes "$NOTES"
          else
            gh release edit studio-latest --title "lecpage 커넥트(최신)" --notes "$NOTES"
          fi
          cd out
          gh release upload studio-latest \
            lecpage-connect.cmd lecpage-connect.sh lecpage-connect.command \
            lecpage-connect.zip lecpage-connect.zip.sha256 lecpage-connect.tar.gz lecpage-connect.tar.gz.sha256 \
            lecpage-connect-mac.zip lecpage-connect-mac.zip.sha256 \
            lecpage-studio.cmd lecpage-studio.sh lecpage-studio.command \
            lecpage-studio.zip lecpage-studio.zip.sha256 lecpage-studio.tar.gz lecpage-studio.tar.gz.sha256 \
            VERSION --clobber
