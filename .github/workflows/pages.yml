# GitHub Pages 미러(예비 주소). 기본 주소는 Cloudflare Workers(wrangler.jsonc, docs/operations.md)
name: Deploy app to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: npm --prefix app ci
      - run: npm --prefix app run build
        env:
          # '바로 배포' 서버 주소를 바꿀 때만(비어 있으면 앱이 운영자 주소에서 열렸을 때 운영 서버를 씀: app/src/lib/publish-api.js)
          VITE_PUBLISH_API: ${{ vars.LECPAGE_PUBLISH_API }}
          # 코드가 든 구글 시트 틀의 '사본 만들기' 주소(docs/operations.md). 비어 있으면 코드 붙여넣기 안내가 나옴
          VITE_SHEET_TEMPLATE: ${{ vars.LECPAGE_SHEET_TEMPLATE }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: app/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 배포 권한은 배포 단계에만
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
