name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 액션은 커밋 SHA로 고정(태그가 바뀌어도 같은 코드). 업데이트는 Dependabot이 PR로 올림
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # 엔진 시험 가운데 PDF 교재를 읽는 것(prepare·check)은 앱의 pdf.js를 씀 → 앱 의존성을 먼저 설치
      - name: 앱 의존성 설치
        run: npm --prefix app ci
      - name: 엔진 테스트
        run: npm test
      # npm audit이 보지 못하는 skill 속 라이브러리(fflate 등)와 판을 고정한 배포 명령: OSV(키 없음)에서 알려진 취약점 확인
      - name: 담아 둔 라이브러리 보안 점검
        run: node scripts/vendor-audit.mjs
      - name: 레퍼런스 사이트 조립·검수
        run: npm run examples
      - name: 앱 빌드
        run: npm --prefix app run build
      # 사용자 약속: 앱 문구는 해요체·번역투 없음(docs/writing.md). 고칠 곳이 하나라도 있으면 실패
      - name: 앱 문구 검사(copy-lint)
        run: node app/scripts/copy-lint.mjs
      # 짧은 앱 흐름(첫 화면 → 디자인 둘러보기 → 개인정보 안내가 그려지고 스크립트 오류 없음). 의존성 판을 올린 PR이 '빌드는 되는데 빈 화면'이 되지 않게
      - name: 앱 짧은 흐름 시험(Playwright Chromium)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund playwright@1.63.0
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node app/scripts/smoke.mjs
      - name: 의존성 보안 점검(앱 배포 묶음·맨 위 wrangler·실시간 서버 템플릿)
        run: |
          npm --prefix app audit --omit=dev --audit-level=high
          npm audit --package-lock-only --audit-level=high
          (cd skills/lecpage/backends/cloudflare && npm audit --package-lock-only --audit-level=high)
  # 윈도우: skill 명령이 셸·bash 없이 도는지(npx 찾기·교재 읽기·레퍼런스 사이트 조립·검수·가짜 wrangler로 배포 순서). 쪽 그림은 LibreOffice가 없어 건너뜀
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env: { LECPAGE_WRANGLER: "${{ github.workspace }}/skills/lecpage/engine/test/fixtures/fake-wrangler.mjs" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: doctor·prepare·check·publish(가짜)·pack
        run: |
          node skills/lecpage/scripts/lecpage.mjs doctor
          node skills/lecpage/scripts/lecpage.mjs prepare skills/lecpage/engine/test/fixtures/workshop.pptx -o .out/win/prep
          node scripts/check-references.mjs data-lab
          node skills/lecpage/scripts/lecpage.mjs publish .out/data-lab --no-verify --no-handouts
          node skills/lecpage/scripts/lecpage.mjs pack .out/data-lab -o .out/win/site.zip
  # 바로 공개 서버(선택 기능): 단위 테스트 + 로컬 workerd 통합 테스트(workerd를 못 띄우면 통합 부분만 건너뜀)
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: 바로 공개 서버 테스트
        run: npm --prefix hosting ci && npm --prefix hosting test
      - name: 의존성 보안 점검(바로 배포 서버)
        run: npm --prefix hosting audit --audit-level=high
